---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletest-service
  labels:
    app: scaletest-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletest-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: scaletest-service
    spec:
      containers:
      - name: scaletest-service
        image: ghcr.io/yandex-practicum/scaletestapp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 1
            memory: 30Mi
          requests:
            cpu: 100m
            memory: 5Mi
      restartPolicy: Always
...
